# Render blueprint — one-click backend deployment.
# Render's Blueprint feature looks for render.yaml at the REPOSITORY ROOT.
# 1. Push this repo to GitHub.
# 2. Render dashboard: New -> Blueprint -> select this repo.
# 3. Fill in the env values marked (set manually) when prompted.
#
# Note: commands run from the repo root, so the backend package is importable
# via `uvicorn backend.app:app`. The Python version is pinned in runtime.txt.

services:
  - type: web
    name: hustlrzz-backend
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port 10000
    healthCheckPath: /
    envVars:
      # --- AI: get a free key at https://console.groq.com/keys ---
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_TEXT_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
      - key: GROQ_TTS_MODEL
        value: canopylabs/orpheus-v1-english
      - key: GROQ_TTS_VOICE
        value: tara
      # --- Firebase (auth + Firestore) ---
      - key: GOOGLE_CLOUD_PROJECT
        value: hustlrzz
      # Paste the full service-account JSON (from Firebase console ->
      # Project settings -> Service accounts -> Generate new private key)
      # into this env var. The backend also supports FIREBASE_KEY_PATH for a
      # locally-mounted file.
      - key: FIREBASE_KEY_JSON
        sync: false
      # --- CORS: your deployed frontend URL(s), comma-separated ---
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:8080,http://localhost:5000,http://localhost,https://hustlrzz.vercel.app
